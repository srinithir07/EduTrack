# Application Name & Port
spring.application.name=EduTrack Academic Performance Management System
server.port=8080

# MySQL Database Configuration (XAMPP Compatible)
spring.datasource.url=jdbc:mysql://localhost:3306/academic_performance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Static Resources Served directly by Embedded Tomcat
spring.web.resources.static-locations=classpath:/static/
